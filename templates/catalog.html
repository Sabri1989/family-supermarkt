<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتالوج المنتجات - Family Supermarkt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: #f8f9fa;
            font-family: 'Cairo', sans-serif;
        }
        .catalog-header {
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            color: white;
            padding: 30px 0;
            text-align: center;
            margin-bottom: 30px;
        }
        .catalog-header h1 {
            font-weight: 800;
        }
        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 6px 18px rgba(0,0,0,0.05);
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 30px rgba(0,0,0,0.1);
        }
        .product-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid #eee;
        }
        .product-info {
            padding: 18px;
            flex-grow: 1;
        }
        .product-title {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #1a2a4a;
        }
        .product-category {
            font-size: 0.7rem;
            color: #f5a623;
            background: #fff8f0;
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            margin-bottom: 10px;
        }
        .product-price {
            color: #0d47a1;
            font-weight: 800;
            font-size: 1.2rem;
        }
        .footer-catalog {
            background: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            border-top: 1px solid #eee;
        }
        @media (max-width: 768px) {
            .product-img {
                height: 160px;
            }
        }
    </style>
</head>
<body>
    <div class="catalog-header">
        <div class="container">
            <h1><i class="fas fa-book-open"></i> كتالوج Family Supermarkt</h1>
            <p class="lead">جميع منتجاتنا الطازجة بجودة عالية – اختر ما يناسب عائلتك</p>
        </div>
    </div>

    <div class="container">
        <div class="row g-4" id="catalogContainer">
            {% for p in products %}
            <div class="col-lg-3 col-md-4 col-sm-6">
                <div class="product-card">
                    <img src="{{ p.image }}" class="product-img" alt="{{ p.name }}" loading="lazy" onerror="this.src='https://placehold.co/400x300/f5a623/white?text=Image'">
                    <div class="product-info">
                        <span class="product-category">{{ p.category }}</span>
                        <h5 class="product-title">{{ p.name }}</h5>
                        <div class="product-price">{{ p.price }} يورو</div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <div class="footer-catalog">
        <div class="container">
            <p>© 2026 Family Supermarkt – نقدم لكم أفضل المنتجات لعائلتكم</p>
            <a href="{{ url_for('index') }}" class="btn btn-outline-primary">العودة إلى الموقع</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

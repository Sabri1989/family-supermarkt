<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - لوحة تحكم Family Supermarkt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            font-family: 'Cairo', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-card h2 {
            color: #0d47a1;
            font-weight: 800;
            text-align: center;
            margin-bottom: 30px;
        }
        .login-card h2 i {
            color: #f5a623;
        }
        .form-control {
            border-radius: 50px;
            padding: 12px 20px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }
        .btn-login {
            background: linear-gradient(135deg, #f5a623, #ffb84d);
            border: none;
            padding: 12px;
            border-radius: 50px;
            font-weight: bold;
            color: #0d47a1;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-login:hover {
            transform: scale(1.02);
            background: #e69500;
        }
        .alert-danger {
            border-radius: 50px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2><i class="fas fa-lock"></i> تسجيل الدخول</h2>
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="input-group mb-3">
                <span class="input-group-text bg-white"><i class="fas fa-user"></i></span>
                <input type="text" class="form-control" name="username" placeholder="اسم المستخدم" required>
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text bg-white"><i class="fas fa-key"></i></span>
                <input type="password" class="form-control" name="password" placeholder="كلمة المرور" required>
            </div>
            <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> دخول</button>
        </form>
    </div>
</body>
</html>
